<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Literatura | UNIOESTE 2027</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5f4;color:#172a46;font:16px/1.6 system-ui,sans-serif}header{background:#142947;color:white;padding:20px max(20px,calc((100% - 1000px)/2));}header small{color:#f0aabd;letter-spacing:2px}h1,h2,h3,p{margin:0 0 12px}h1{font: bold 32px Georgia,serif}h2{font: bold 26px Georgia,serif}main{max-width:1000px;margin:auto;padding:22px}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #c8cbd2;border-radius:10px;padding:10px 15px;background:white;color:#142947}button:hover{border-color:#a64a70}button.primary{background:#142947;color:white;border-color:#142947}nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.hero{background:#142947;color:white;border-radius:16px;padding:22px;margin-bottom:20px}.progress{background:#52617a;height:9px;border-radius:9px;overflow:hidden;margin:12px 0}.bar{background:#e6a2b7;height:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tile,.panel{background:white;border:1px solid #e2dcda;border-radius:14px;padding:20px}.tile{text-align:left;display:flex;flex-direction:column;gap:5px;min-height:130px}.tile strong{font: bold 22px Georgia,serif}.tag{color:#a13d64;font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:bold}.muted{color:#566172;font-size:14px}.stage{margin:25px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.page{white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.65 Georgia,serif;background:white;border-top:1px solid #ddd;padding:18px 0}.opt{display:block;width:100%;text-align:left;margin:8px 0;white-space:pre-line}.good{background:#e3f2e8;border-color:#39835c}.bad{background:#f8e2e2;border-color:#a85555}.feedback{border-left:4px solid #a64a70;padding:12px;margin:12px 0;background:#f8f1f4}.hidden{display:none}footer{padding:24px;text-align:center;font-size:13px;color:#566172}details{margin:10px 0}summary{cursor:pointer;font-weight:bold}input{padding:12px;border:1px solid #ccc;border-radius:10px;width:100%;margin-bottom:10px}button:focus-visible{outline:3px solid #a64a70;outline-offset:2px}@media(max-width:500px){main{padding:14px}.panel{padding:15px}h1{font-size:26px}}#login{max-width:420px;margin:40px auto;padding:0 20px}#login .panel{display:block}#login button{width:100%}#msg{color:#a85555;min-height:22px;font-size:14px}#sair{float:right;font-size:13px;padding:6px 12px;background:transparent;color:white;border-color:#52617a}</style><header><small>ENTRE O TEXTO E O MUNDO</small><button id="sair" class="hidden">Sair</button><h1>Literatura · UNIOESTE 2027</h1><div>Curso de revisão | Profe Ana Claudia Wittholter</div></header><div id="login"><div class="panel"><h2>Acesse sua apostila</h2><p class="muted">Use o e-mail e a senha enviados após a compra.</p><input id="email" type="email" placeholder="E-mail" autocomplete="username"><input id="senha" type="password" placeholder="Senha" autocomplete="current-password"><p id="msg"></p><button class="primary" id="entrar">Entrar</button></div></div><main class="hidden" id="main"><nav><button onclick="home()">Início</button><button onclick="review()">Revisão de véspera</button><button onclick="quiz(-1)">Banco de questões</button><button onclick="library()">Apostila</button></nav><div id="app"></div></main><footer class="hidden" id="foot">© 2026 Ana Claudia Wittholter · Material de uso individual. Respeite os direitos autorais.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script>
const SB_URL='https://khqihguzhioqiueudoie.supabase.co',SB_KEY='sb_publishable_NxzC5GUwQAVBGZth6McAqA_BkiR5qA5';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=i=>document.getElementById(i);let started=false;
function ui(on){$('login').classList.toggle('hidden',on);$('main').classList.toggle('hidden',!on);$('foot').classList.toggle('hidden',!on);$('sair').classList.toggle('hidden',!on)}
async function start(){

</script><script type="text/plain" id="appcode">let done={},responses={};try{done=JSON.parse(localStorage.getItem('uniDone')||'{}');responses=JSON.parse(localStorage.getItem('uniAnswers')||'{}')}catch(e){};const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('uniDone',JSON.stringify(done));localStorage.setItem('uniAnswers',JSON.stringify(responses))}catch(e){}}function show(s){app.innerHTML=s;window.scrollTo(0,0)}function home(){let count=D.modules.filter((m,i)=>done[i]).length;let total=Object.keys(responses).length;let correct=Object.values(responses).filter(Boolean).length;show(`<div class="hero"><div class="tag" style="color:#f0aabd">Seu percurso</div><h2>${count} de 19 obras concluídas</h2><div class="progress"><div class="bar" style="width:${count/19*100}%"></div></div><p>${correct} acertos em ${total} questões respondidas</p></div><h2>Escolha uma obra</h2><input id="search" placeholder="Buscar obra, autor ou período" oninput="filter(this.value)"><div id="tiles"></div>`);filter('')}function filter(v){document.getElementById('tiles').innerHTML=[1,2,3].map(s=>`<h3 class="stage">${s}ª etapa</h3><div class="grid">${D.modules.map((m,i)=>({m,i})).filter(({m})=>m.stage===s&&`${m.title} ${m.author} ${m.context}`.toLowerCase().includes(v.toLowerCase())).map(({m,i})=>`<button class="tile" onclick="moduleView(${i})"><span class="tag">${done[i]?'Concluído · ':''}${esc(m.context)}</span><strong>${esc(m.title)}</strong><span class="muted">${esc(m.author)}</span><span>Estudar →</span></button>`).join('')}</div>`).join('')}function moduleView(i){let m=D.modules[i];show(`<div class="panel"><div class="tag">${m.stage}ª etapa · ${esc(m.context)}</div><h2>${esc(m.title)}</h2><p>${esc(m.author)}</p><div class="feedback"><strong>O que não esquecer</strong><p>${esc(m.flash)}</p></div><div class="actions"><button class="primary" onclick="quiz(${m.group},${i})">Praticar questões</button><button onclick="mark(${i})">${done[i]?'Desmarcar conclusão':'Marcar como concluída'}</button></div><p class="muted">Material original: páginas ${m.start}–${m.end}. Algumas obras compartilham contexto e questões comparativas.</p><button onclick="openPDF(${m.start})">Abrir apostila original nesta página</button><h3 style="margin-top:20px">Aulas e leitura</h3>${D.pages.slice(m.start-1,m.end).map((p,j)=>p?`<details ${j===0?'open':''}><summary>Página ${m.start+j}</summary><div class="page">${esc(p)}</div></details>`:'').join('')}<div class="actions"><button onclick="home()">Voltar aos módulos</button>${i<18?`<button class="primary" onclick="moduleView(${i+1})">Próxima obra →</button>`:''}</div></div>`)}function mark(i){done[i]=!done[i];save();moduleView(i)}function review(){show(`<h2>Revisão de véspera</h2><p>Recorde o conteúdo antes de revelar a resposta.</p><div class="grid">${D.modules.map((m,i)=>`<details class="panel"><summary>${esc(m.title)}</summary><p class="muted">${esc(m.author)} · ${esc(m.context)}</p><p>${esc(m.flash)}</p><button onclick="moduleView(${i})">Revisar obra</button></details>`).join('')}</div>`)}let current=[];let parent=-1;let pos=0;let selected={};function quiz(g,i=-1){parent=i;current=D.questions.flatMap((arr,j)=>g===-1||g===j?arr.map((q,k)=>({...q,id:j+'-'+k})):[]);pos=0;selected={};question()}function question(){let q=current[pos];if(!q){let n=Object.values(selected).filter(x=>x.ok).length;show(`<div class="panel"><h2>Treino concluído</h2><p>${n} de ${current.length} acertos nesta tentativa.</p><button onclick="${parent>=0?'moduleView('+parent+')':'home()'}">Voltar</button></div>`);return}let a=selected[q.id];show(`<div class="panel"><div class="tag">Questão ${pos+1} de ${current.length}</div><div class="progress"><div class="bar" style="width:${(pos+1)/current.length*100}%"></div></div><h3 style="white-space:pre-line">${esc(q.q)}</h3>${q.opts.map((o,k)=>{let letter='ABCDE'[k];return `<button class="opt ${a?(letter===q.answer?'good':letter===a.letter?'bad':''):''}" ${a?'disabled':''} onclick="choose('${letter}')">${letter}) ${esc(o)}</button>`}).join('')}${a?`<div class="feedback"><strong>${a.ok?'Resposta correta!':'Gabarito: '+q.answer}</strong><p>${esc(q.comment)}</p></div><button class="primary" onclick="pos++;question()">${pos===current.length-1?'Ver resultado':'Próxima questão →'}</button>`:''}<div class="actions"><button onclick="${parent>=0?'moduleView('+parent+')':'home()'}">Sair do treino</button></div></div>`)}function choose(letter){let q=current[pos];let ok=letter===q.answer;selected[q.id]={letter,ok};responses[q.id]=ok;save();question()}let pdfURL;function openPDF(p=1){if(!pdfURL){const bytes=Uint8Array.from(atob(PDF),c=>c.charCodeAt(0));pdfURL=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}))}window.open(pdfURL+'#page='+p,'_blank')}function library(){show(`<div class="panel"><h2>Apostila integral</h2><p>172 páginas com a diagramação, quadros, textos, análises e gabaritos originais.</p><button class="primary" onclick="openPDF()">Abrir PDF original</button><h3 style="margin-top:20px">Fundamentos</h3><button onclick="openPDF(3)">Apresentação e glossário</button> <button onclick="openPDF(162)">Quadros de revisão</button></div>`)}home();</script></html>
